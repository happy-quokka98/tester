# CI pipelines 

name: CI Pipeline

on:
    push:
        branches : [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: ${{ github.workflow }} - ${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: HTML validation
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v7

            - name: validation of html
              uses: cyb3r-jak3/html5validator-action@v7.2.0
              with: 
                root: .
                blacklist: .git